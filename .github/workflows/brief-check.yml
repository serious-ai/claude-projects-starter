name: Brief check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check AGENTS.md and the example briefs
        run: python3 scripts/check_brief.py AGENTS.md examples/*.md
